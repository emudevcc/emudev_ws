name: CI

on:
  push:
    branches: [development, main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [development, main]

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Use dev vars for CI build verification
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID_DEV || 'zziqxayh' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV || 'placeholder' }}
          NEXT_PUBLIC_SITE_URL: https://emudev.cc
          NEXT_PUBLIC_SITE_DOMAIN: emudev.cc
          SANITY_REVALIDATE_SECRET: ci-placeholder
        run: npm run build

  # Static smoke tests — read source files directly, no browser or server needed.
  # Runs in parallel with the ci job for fast feedback.
  smoke-static:
    name: Smoke · Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Static smoke tests
        run: npx playwright test tests/smoke/i18n-bilingual.spec.ts tests/smoke/content-model.spec.ts --grep "static contracts|content model static contracts" --reporter=list

  # Integration smoke tests — starts the Next.js server and runs full browser checks.
  # continue-on-error while Phase 2 (UI string extraction) and Phase 4 (hreflang) are in progress.
  # Remove continue-on-error once both phases are complete.
  smoke-integration:
    name: Smoke · Integration
    runs-on: ubuntu-latest
    needs: [ci]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID_DEV || 'zziqxayh' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV || 'placeholder' }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_DOMAIN: emudev.cc
          SANITY_REVALIDATE_SECRET: ci-placeholder
        run: npm run build

      - name: Start server
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID_DEV || 'zziqxayh' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV || 'placeholder' }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_DOMAIN: emudev.cc
          SANITY_REVALIDATE_SECRET: ci-placeholder
        run: npm start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/en --timeout 60000

      - name: Integration i18n smoke tests
        env:
          BASE_URL: http://localhost:3000
          I18N_SMOKE_INTEGRATION: '1'
        run: npx playwright test tests/smoke/i18n-bilingual.spec.ts --reporter=list
