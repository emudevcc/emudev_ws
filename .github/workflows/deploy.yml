name: Deploy

# Vercel handles build + deploy via git integration.
# This workflow only runs post-deploy tasks on main: migrations, CF purge, release tag.
on:
  push:
    branches: [main]

jobs:
  post-deploy:
    name: Post-Deploy (migrations + CF purge + tag)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://emudev.cc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Apply Supabase migrations
        run: npx supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --dns-resolver https
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PAT }}

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'

      - name: Tag release
        run: |
          TAG="prod-$(date +%Y%m%d-%H%M%S)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG" -m "Production deploy $TAG"
          git push origin "$TAG"
